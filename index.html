
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Madurai City Open World V1.3 Story</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b8d8;font-family:Arial}
#game{position:fixed;inset:0}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:10px;left:10px;z-index:5;color:white;background:#101820d9;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.7;pointer-events:none;border:1px solid #ffffff40}
#hud b{font-size:15px;color:#ffdc70}
#mission{color:#ffe66b}
#map{position:fixed;right:10px;top:10px;width:125px;height:125px;border-radius:50%;border:2px solid white;background:#263c2a;z-index:5;pointer-events:none}
#controls{position:fixed;inset:0;z-index:10;pointer-events:none}
#stick{position:absolute;left:20px;bottom:25px;width:135px;height:135px;border-radius:50%;border:2px solid #ffffff9c;background:#ffffff30;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:49px;height:49px;border-radius:50%;background:#ffffffcc;border:2px solid white;pointer-events:none}
.btn{position:absolute;pointer-events:auto;touch-action:none;border:2px solid #ffffffaa;background:#101820c9;color:white;border-radius:50%;font-weight:bold}
#jump{right:20px;bottom:30px;width:67px;height:67px}
#run{right:100px;bottom:30px;width:67px;height:67px}
#carbtn{right:20px;bottom:112px;width:67px;height:67px}
#reset{right:100px;bottom:112px;width:67px;height:67px}
#help{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);background:#0009;color:white;padding:5px 9px;border-radius:8px;font-size:10px;white-space:nowrap;pointer-events:none;z-index:5}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101820;color:white;z-index:20;text-align:center;padding:25px}
#loading.hide{display:none}

/* STORY UI */
#storyBox{
 position:fixed;left:50%;bottom:190px;transform:translateX(-50%);
 width:90%;max-width:420px;background:#101820ed;color:white;
 padding:15px;border:2px solid #ffdc70;border-radius:13px;
 z-index:30;display:none;text-align:left;
 font-size:14px;line-height:1.6;
 box-shadow:0 5px 25px #0009
}
#storyName{color:#ffdc70;font-size:16px;font-weight:bold}
#storyText{min-height:48px}
#storyNext{
 display:block;margin-left:auto;padding:10px 22px;
 background:#e4ad38;border:0;border-radius:8px;
 font-weight:bold;color:#171717
}
#storyAction{
 position:fixed;right:20px;bottom:195px;z-index:25;
 width:70px;height:70px;border-radius:50%;
 background:#a46c20;color:white;border:2px solid white;
 font-weight:bold;display:none;touch-action:manipulation
}
#storyHint{
 position:fixed;top:145px;left:50%;transform:translateX(-50%);
 background:#101820dd;color:#ffdc70;padding:8px 13px;
 border-radius:9px;font-size:12px;z-index:8;
 display:none;pointer-events:none;white-space:nowrap
}
</style>
</head>
<body>

<div id="loading"><div>
<h2>MADURAI CITY</h2>
<p>Loading Open World V1.3 Story...</p>
</div></div>

<div id="game"></div>

<div id="hud">
<b>MADURAI CITY V1.3</b><br>
💵 Cash: ₹<span id="cash">0</span><br>
❤️ Health: 100<br>
📦 Packages: <span id="packages">0</span>/8<br>
🚗 Vehicle: <span id="vehicle">Walking</span><br>
<div id="mission">Story: Find Karthik</div>
</div>

<canvas id="map" width="180" height="180"></canvas>

<div id="controls">
<div id="stick"><div id="knob"></div></div>
<button class="btn" id="jump">JUMP</button>
<button class="btn" id="run">RUN</button>
<button class="btn" id="carbtn">CAR</button>
<button class="btn" id="reset">RESET</button>
</div>

<div id="help">Joystick: Move / Steer | Drag screen: Camera | CAR: Enter/Exit</div>
<div id="storyHint">Find Karthik and press ACTION</div>

<div id="storyBox">
 <div id="storyName">KARTHIK</div>
 <div id="storyText"></div>
 <button id="storyNext">CONTINUE</button>
</div>

<button id="storyAction">ACTION</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(()=>{
"use strict";

const $=id=>document.getElementById(id);
const game=$("game");

if(!window.THREE){
 $("loading").innerHTML="<div><h2>Three.js failed to load</h2><p>Check your internet connection and reload.</p></div>";
 return;
}

// ENGINE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ac5e9);
scene.fog=new THREE.Fog(0x8ac5e9,100,330);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,800);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe7f4ff,0x52633d,2));

const sunlight=new THREE.DirectionalLight(0xffe4bd,3);
sunlight.position.set(-70,110,60);
sunlight.castShadow=true;
sunlight.shadow.mapSize.set(2048,2048);
sunlight.shadow.camera.left=-120;
sunlight.shadow.camera.right=120;
sunlight.shadow.camera.top=120;
sunlight.shadow.camera.bottom=-120;
sunlight.shadow.bias=-.0003;
scene.add(sunlight);

const fillLight=new THREE.DirectionalLight(0xa8cfff,.7);
fillLight.position.set(50,35,-70);
scene.add(fillLight);

const mat=(color,roughness=.8,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const mats={
 skin:mat(0xb87950),
 skinLight:mat(0xd49b73),
 hair:mat(0x171411),
 black:mat(0x17191c),
 white:mat(0xf0eee5),
 road:mat(0x292d32),
 line:mat(0xf6e6a0),
 grass:mat(0x537c40),
 glass:new THREE.MeshStandardMaterial({
  color:0x294b60,roughness:.22,metalness:.25,
  transparent:true,opacity:.88
 }),
 rubber:mat(0x171717),
 metal:mat(0x777f85,.3,.75)
};

function box(parent,x,y,z,w,h,d,material,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=cast;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function sphere(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),material);
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 m.castShadow=true;
 parent.add(m);
 return m;
}

function cylinder(parent,x,y,z,r1,r2,h,material){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),material);
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);
 return m;
}

// CITY GROUND AND ROADS
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mats.grass);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const buildings=[];

for(let p=-160;p<=160;p+=40){
 box(scene,p,.02,0,14,.04,400,mats.road,false);
 box(scene,0,.02,p,400,.04,14,mats.road,false);

 for(let q=-190;q<=190;q+=12){
  box(scene,p,.05,q,.22,.025,5,mats.line,false);
  box(scene,q,.05,p,5,.025,.22,mats.line,false);
 }
}

for(let p=-160;p<=160;p+=40){
 box(scene,p+10,.1,0,5,.2,400,mat(0xb6b3a8),false);
 box(scene,p-10,.1,0,5,.2,400,mat(0xb6b3a8),false);
 box(scene,0,.1,p+10,400,.2,5,mat(0xb6b3a8),false);
 box(scene,0,.1,p-10,400,.2,5,mat(0xb6b3a8),false);
}

// BUILDINGS
const wallColors=[
 0xc6a889,0xd9c9ac,0xb4c4b3,0xd7a77f,
 0xe2d8c7,0xaaa8a0,0xbca3a0,0xc9b5a0
];

function createBuilding(x,z,index){
 const group=new THREE.Group();
 const w=9+Math.random()*5;
 const d=9+Math.random()*5;
 const floors=2+Math.floor(Math.random()*5);
 const h=floors*3.4;
 const wall=mat(wallColors[index%wallColors.length]);

 box(group,0,h/2,0,w,h,d,wall);
 box(group,0,h+.18,0,w+.5,.35,d+.5,mat(0x77716b));

 for(let floor=0;floor<floors;floor++){
  const y=2+floor*3.4;
  for(let col=-1;col<=1;col++){
   const wx=col*w*.28;
   box(group,wx,y,d/2+.04,w*.19,1.35,.1,mats.glass);
   box(group,wx,y-.76,d/2+.1,w*.22,.12,.25,mat(0x77746c));
   box(group,wx,y+.76,d/2+.1,w*.22,.1,.25,mat(0xffffff));
  }
 }

 if(index%3===0){
  box(group,0,2.4,d/2+.18,w*.82,.55,.15,mat(0xb33126));
  box(group,0,1.05,d/2+.1,1.5,2.1,.12,mats.glass);
  box(group,0,.2,d/2+.3,w*.9,.15,.5,mat(0xaaa49a));
 }

 for(let floor=0;floor<floors;floor++){
  const y=2+floor*3.4;
  box(group,w/2+.05,y,0,.1,1.2,d*.35,mats.glass);
 }

 if(index%2===0){
  for(let floor=1;floor<floors;floor++){
   const y=floor*3.4+1.4;
   box(group,0,y,d/2+.5,w*.8,.12,.9,mat(0xaaa49a));
   box(group,0,y+.5,d/2+.9,w*.8,.08,.08,mats.metal);
   for(let k=-3;k<=3;k++){
    box(group,k*w*.1,y+.25,d/2+.9,.04,.5,.04,mats.metal,false);
   }
  }
 }

 group.position.set(x,0,z);
 scene.add(group);
 buildings.push({x,z,w,d});
}

let buildingIndex=0;
for(let x=-150;x<=150;x+=40){
 for(let z=-150;z<=150;z+=40){
  if(Math.abs(x%40)<1&&Math.abs(z%40)<1)continue;
  if(Math.random()<.14)continue;
  createBuilding(x+20,z+20,buildingIndex++);
 }
}

// TREES AND STREETLIGHTS
function createTree(x,z){
 const group=new THREE.Group();
 cylinder(group,0,1.5,0,.35,.5,3,mat(0x68452a));
 const leaves=mat(0x23652c);
 sphere(group,0,3.6,0,2,2.2,2,leaves);
 sphere(group,-.9,3.3,.2,1.3,1.5,1.3,leaves);
 sphere(group,.9,3.3,-.2,1.3,1.5,1.3,leaves);
 group.position.set(x,0,z);
 scene.add(group);
}

function createStreetlight(x,z){
 const g=new THREE.Group();
 cylinder(g,0,3,0,.08,.12,6,mats.metal);
 box(g,.65,5.7,0,1.3,.1,.1,mats.metal);
 sphere(g,1.2,5.6,0,.22,.12,.22,mat(0xffedba));
 g.position.set(x,0,z);
 scene.add(g);
}

for(let x=-150;x<=150;x+=20){
 for(let z=-150;z<=150;z+=40){
  if(Math.random()>.35)createTree(x,z);
 }
}

for(let p=-150;p<=150;p+=40){
 createStreetlight(p+10,-12);
 createStreetlight(p-10,12);
}

// HUMAN CHARACTER
function createHuman(shirtColor=0x244f9a,pantsColor=0x24272d){
 const g=new THREE.Group();
 const shirt=mat(shirtColor);
 const pants=mat(pantsColor);
 const shoe=mat(0x171717);
 const skin=mats.skinLight;
 const hair=mats.hair;

 const torso=new THREE.Group();
 g.add(torso);
 box(torso,0,1.42,0,.75,.95,.4,shirt);
 box(torso,0,.9,0,.65,.22,.38,pants);

 cylinder(g,0,2.02,0,.13,.14,.25,skin);

 const head=new THREE.Group();
 head.position.y=2.35;
 g.add(head);
 sphere(head,0,0,0,.31,.4,.29,skin);
 sphere(head,0,.25,-.02,.32,.19,.3,hair);
 box(head,0,.13,-.25,.48,.18,.1,hair);
 sphere(head,-.31,-.02,0,.07,.11,.08,skin);
 sphere(head,.31,-.02,0,.07,.11,.08,skin);

 const eyeMat=mat(0x151515);
 sphere(head,-.12,.04,.27,.045,.045,.035,eyeMat);
 sphere(head,.12,.04,.27,.045,.045,.035,eyeMat);
 sphere(head,-.12,.055,.3,.014,.014,.012,mat(0xffffff));
 sphere(head,.12,.055,.3,.014,.014,.012,mat(0xffffff));
 sphere(head,0,-.06,.3,.055,.09,.06,skin);
 box(head,0,-.19,.28,.12,.025,.025,mat(0x642f2b));

 const arms=[];
 for(const side of [-1,1]){
  const arm=new THREE.Group();
  arm.position.set(side*.46,1.75,0);
  g.add(arm);
  cylinder(arm,0,-.3,0,.13,.16,.58,shirt);
  sphere(arm,0,-.65,.01,.12,.13,.12,skin);
  arms.push(arm);
 }

 const legs=[];
 for(const side of [-1,1]){
  const leg=new THREE.Group();
  leg.position.set(side*.2,.88,0);
  g.add(leg);
  cylinder(leg,0,-.3,0,.15,.17,.62,pants);
  sphere(leg,0,-.62,0,.14,.15,.14,pants);
  cylinder(leg,0,-.9,0,.12,.13,.42,pants);
  box(leg,0,-1.12,.1,.28,.17,.43,shoe);
  legs.push(leg);
 }

 return {group:g,arms,legs,head,torso};
}

const playerModel=createHuman(0x2455aa,0x252a35);
const player=playerModel.group;
player.position.set(0,0,8);
scene.add(player);

// STORY CHARACTER: KARTHIK
const karthikModel=createHuman(0x9b3028,0x252a35);
const karthik=karthikModel.group;
karthik.position.set(10,0,8);
scene.add(karthik);

// CARS
function createCar(color=0xc92520){
 const g=new THREE.Group();
 const paint=mat(color,.35,.45);
 const dark=mat(0x202a32,.3,.2);

 box(g,0,.75,0,2.2,.7,4.2,paint);
 box(g,0,1.05,-.1,2.15,.4,3.5,paint);
 box(g,0,1.48,-.25,1.85,.95,2.1,dark);
 box(g,0,1.5,.82,1.75,.8,.08,mats.glass);
 box(g,0,1.5,-1.33,1.75,.8,.08,mats.glass);
 box(g,-.96,1.48,-.25,.08,.75,1.9,mats.glass);
 box(g,.96,1.48,-.25,.08,.75,1.9,mats.glass);
 box(g,0,2.02,-.25,1.9,.13,2.1,paint);
 box(g,0,.55,2.12,2.25,.2,.2,mats.metal);
 box(g,0,.55,-2.12,2.25,.2,.2,mats.metal);

 const headlight=mat(0xfff4c0,.2);
 const tail=mat(0xb00000,.25);

 for(const x of [-.75,.75]){
  box(g,x,.88,2.13,.42,.24,.06,headlight);
  box(g,x,.88,-2.13,.42,.24,.06,tail);
 }

 const wheels=[];
 for(const x of [-1.12,1.12]){
  for(const z of [-1.35,1.35]){
   const wheel=new THREE.Group();
   const tire=new THREE.Mesh(
    new THREE.CylinderGeometry(.43,.43,.25,20),mats.rubber
   );
   tire.rotation.z=Math.PI/2;
   wheel.add(tire);
   const hub=new THREE.Mesh(
    new THREE.CylinderGeometry(.22,.22,.27,12),mats.metal
   );
   hub.rotation.z=Math.PI/2;
   wheel.add(hub);
   wheel.position.set(x,.47,z);
   g.add(wheel);
   wheels.push(wheel);
  }
 }

 return {group:g,wheels};
}

const playerCar=createCar(0xc92520);
const car=playerCar.group;
car.position.set(4,0,8);
scene.add(car);

// TRAFFIC
const traffic=[];
const carColors=[0xe9e9e9,0x2255aa,0xd5a329,0x222222,0x228844,0xc0392b];

for(let i=0;i<12;i++){
 const model=createCar(carColors[i%carColors.length]);
 const t=model.group;
 const horizontal=i%2===0;

 t.position.set(
  horizontal?-130+Math.random()*260:(i%4-2)*40,
  0,
  horizontal?(i%4-2)*40:-130+Math.random()*260
 );

 t.userData={
  horizontal,
  dir:i%4<2?1:-1,
  speed:5+Math.random()*5,
  wheels:model.wheels
 };

 scene.add(t);
 traffic.push(t);
}

// PEDESTRIANS
const npcs=[];
const npcColors=[0x27845a,0xd08b27,0x9b4f8c,0x315a9d,0x9d453d];

for(let i=0;i<24;i++){
 const npcModel=createHuman(npcColors[i%npcColors.length],0x34343b);
 const npc=npcModel.group;

 npc.position.set((Math.random()-.5)*180,0,(Math.random()-.5)*180);

 npc.userData={
  model:npcModel,
  angle:Math.random()*Math.PI*2,
  speed:.5+Math.random()*1.1,
  phase:Math.random()*6
 };

 scene.add(npc);
 npcs.push(npc);
}

// PACKAGES: ORIGINAL COLLECTION MISSION
const packages=[];

for(let i=0;i<8;i++){
 const p=new THREE.Group();

 box(p,0,.4,0,.8,.8,.8,mat(0xe3ae21));
 box(p,0,.4,.42,.15,.8,.04,mat(0x8a5410));

 p.position.set(
  (Math.floor(Math.random()*7)-3)*20+5,
  0,
  (Math.floor(Math.random()*7)-3)*20+5
 );

 scene.add(p);
 packages.push(p);
}

// STORY PARCEL
const storyParcel=new THREE.Group();
box(storyParcel,0,.5,0,1.2,1,1.2,mat(0xe4b52b));
box(storyParcel,0,.5,.62,.15,1,.05,mat(0x75421a));
storyParcel.position.set(-105,0,105);
scene.add(storyParcel);
let storyParcelFound=false;

// STORY SYSTEM
let storyStage=0;
let storyLine=0;
let storyOpen=false;
let storyRewardPaid=false;

const storyScenes=[
 {
  name:"KARTHIK",
  lines:[
   "Dei! You're finally back in Madurai!",
   "It's been a long time since we met. How are you?",
   "I need your help. Something strange happened yesterday.",
   "A delivery parcel disappeared from our garage.",
   "Can you help me find it?"
  ]
 },
 {
  name:"KARTHIK",
  lines:[
   "Thanks, friend! I knew I could trust you.",
   "I heard someone saw a yellow parcel near the old market.",
   "Go there and look carefully.",
   "Find the parcel and bring it back to me."
  ]
 },
 {
  name:"KARTHIK",
  lines:[
   "You found the parcel! Excellent work!",
   "I was worried we had lost it forever.",
   "There is something else I need to tell you.",
   "Come back to me. We have a bigger problem."
  ]
 },
 {
  name:"KARTHIK",
  lines:[
   "The parcel is safe now. Thank you!",
   "But someone has been asking about you in Madurai.",
   "I don't know who it is yet.",
   "This is only the beginning of our story.",
   "Welcome back to Madurai, my friend!"
  ]
 }
];

const storyBox=$("storyBox");
const storyName=$("storyName");
const storyText=$("storyText");
const storyNext=$("storyNext");
const storyAction=$("storyAction");
const storyHint=$("storyHint");

function updateStoryMission(){
 const missions=[
  "Story 1: Find Karthik",
  "Story 2: Find the missing parcel",
  "Story 3: Return to Karthik",
  "Story complete! Explore Madurai"
 ];
 $("mission").textContent=missions[storyStage];
}

function openStory(){
 if(storyOpen)return;

 storyOpen=true;
 storyLine=0;
 storyBox.style.display="block";
 storyAction.style.display="none";
 storyHint.style.display="none";
 displayStoryLine();
}

function displayStoryLine(){
 const current=storyScenes[storyStage];
 storyName.textContent=current.name;
 storyText.textContent=current.lines[storyLine];

 storyNext.textContent=
  storyLine===current.lines.length-1?"FINISH":"CONTINUE";
}

storyNext.onclick=()=>{
 if(!storyOpen)return;

 storyLine++;

 if(storyLine<storyScenes[storyStage].lines.length){
  displayStoryLine();
  return;
 }

 storyBox.style.display="none";
 storyOpen=false;

 if(storyStage===0){
  storyStage=1;
 }else if(storyStage===2){
  storyStage=3;

  if(!storyRewardPaid){
   cash+=500;
   $("cash").textContent=cash;
   storyRewardPaid=true;
  }
 }

 updateStoryMission();
};

// CONTROLS
let joyX=0,joyY=0;
let stickId=null;
let running=false;
let inCar=false;
let jumping=false;
let verticalSpeed=0;
let cash=0,packageCount=0;

// Separate movement reference from camera angle.
let cameraAngle=0;
let controlAngle=0;
let cameraTilt=.22;
let cameraOffset=0;
const cameraDistance=9;

const stick=$("stick");
const knob=$("knob");

function readStick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=44;
 const length=Math.hypot(dx,dy);

 if(length>max){
  dx=dx/length*max;
  dy=dy/length*max;
 }

 knob.style.transform=`translate(${dx}px,${dy}px)`;
 joyX=dx/max;
 joyY=dy/max;

 if(Math.abs(joyX)<.08)joyX=0;
 if(Math.abs(joyY)<.08)joyY=0;
}

function releaseStick(){
 stickId=null;
 joyX=0;
 joyY=0;
 knob.style.transform="translate(0px,0px)";
}

stick.addEventListener("pointerdown",e=>{
 e.preventDefault();
 e.stopPropagation();
 stickId=e.pointerId;
 controlAngle=cameraAngle;
 stick.setPointerCapture(e.pointerId);
 readStick(e);
});

stick.addEventListener("pointermove",e=>{
 if(e.pointerId!==stickId)return;
 e.preventDefault();
 e.stopPropagation();
 readStick(e);
});

stick.addEventListener("pointerup",e=>{
 if(e.pointerId===stickId)releaseStick();
});

stick.addEventListener("pointercancel",releaseStick);
stick.addEventListener("lostpointercapture",releaseStick);

// MANUAL CAMERA DRAG
let cameraPointer=null,lastX=0,lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 cameraPointer=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==cameraPointer)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 lastX=e.clientX;
 lastY=e.clientY;

 cameraOffset+=dx*.006;
 cameraTilt=THREE.MathUtils.clamp(
  cameraTilt+dy*.003,-.08,.75
 );

 if(stickId===null){
  controlAngle=cameraAngle+dx*.006;
 }
});

function stopCamera(e){
 if(e.pointerId===cameraPointer)cameraPointer=null;
}

renderer.domElement.addEventListener("pointerup",stopCamera);
renderer.domElement.addEventListener("pointercancel",stopCamera);
renderer.domElement.addEventListener("lostpointercapture",stopCamera);

// RUN
const runButton=$("run");

runButton.addEventListener("pointerdown",e=>{
 e.preventDefault();
 e.stopPropagation();
 running=true;
});

["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
 runButton.addEventListener(ev,()=>running=false);
});

// JUMP
$("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 e.stopPropagation();

 if(!inCar&&!jumping&&!storyOpen){
  jumping=true;
  verticalSpeed=7.5;
 }
});

// CAR ENTER/EXIT
$("carbtn").addEventListener("click",()=>{
 if(storyOpen)return;

 if(!inCar){
  if(player.position.distanceTo(car.position)<6){
   inCar=true;
   player.visible=false;
   $("vehicle").textContent="Red car";
  }else{
   $("mission").textContent="Go near the red car to enter";
  }
 }else{
  inCar=false;
  player.visible=true;
  player.position.copy(car.position);
  player.position.x+=3;
  player.rotation.y=car.rotation.y;
  controlAngle=cameraAngle;
  $("vehicle").textContent="Walking";
 }
});

// RESET
$("reset").addEventListener("click",()=>{
 player.position.set(0,0,8);
 player.rotation.y=0;

 car.position.set(4,0,8);
 car.rotation.y=0;

 player.visible=true;
 inCar=false;

 cameraAngle=0;
 controlAngle=0;
 cameraOffset=0;
 cameraTilt=.22;

 releaseStick();

 $("vehicle").textContent="Walking";
});

// COLLISION
function blocked(x,z,r){
 for(const b of buildings){
  if(Math.abs(x-b.x)<b.w/2+r &&
     Math.abs(z-b.z)<b.d/2+r)return true;
 }
 return false;
}

function moveObject(obj,dx,dz,r){
 const nx=obj.position.x+dx;

 if(!blocked(nx,obj.position.z,r)){
  obj.position.x=nx;
 }

 const nz=obj.position.z+dz;

 if(!blocked(obj.position.x,nz,r)){
  obj.position.z=nz;
 }
}

// CAMERA FOLLOW
function updateCamera(dt){
 const target=inCar?car:player;
 const heading=target.rotation.y;

 const desiredAngle=heading+cameraOffset;

 let difference=Math.atan2(
  Math.sin(desiredAngle-cameraAngle),
  Math.cos(desiredAngle-cameraAngle)
 );

 cameraAngle+=difference*(1-Math.exp(-4.5*dt));

 const height=inCar?1.4:1.55;
 const horizontal=Math.cos(cameraTilt)*cameraDistance;
 const vertical=Math.sin(cameraTilt)*cameraDistance;

 const desired=new THREE.Vector3(
  target.position.x-Math.sin(cameraAngle)*horizontal,
  target.position.y+height+vertical,
  target.position.z-Math.cos(cameraAngle)*horizontal
 );

 camera.position.lerp(desired,1-Math.exp(-7*dt));

 camera.lookAt(
  target.position.x,
  target.position.y+height,
  target.position.z
 );
}

// MINIMAP
const map=$("map");
const ctx=map.getContext("2d");

function drawMap(){
 ctx.clearRect(0,0,180,180);
 ctx.fillStyle="#284b32";
 ctx.fillRect(0,0,180,180);

 ctx.fillStyle="#555";

 for(let i=0;i<180;i+=24){
  ctx.fillRect(i,0,7,180);
  ctx.fillRect(0,i,180,7);
 }

 const pos=inCar?car.position:player.position;

 packages.forEach(p=>{
  if(!p.visible)return;

  const x=90+(p.position.x-pos.x)*.6;
  const y=90+(p.position.z-pos.z)*.6;

  ctx.fillStyle="#ffe600";
  ctx.fillRect(x-2,y-2,5,5);
 });

 // Story parcel marker
 if(!storyParcelFound){
  const px=90+(storyParcel.position.x-pos.x)*.6;
  const py=90+(storyParcel.position.z-pos.z)*.6;
  ctx.fillStyle="#ff9d00";
  ctx.fillRect(px-3,py-3,7,7);
 }

 // Karthik marker
 const kx=90+(karthik.position.x-pos.x)*.6;
 const ky=90+(karthik.position.z-pos.z)*.6;
 ctx.fillStyle="#ff55aa";
 ctx.beginPath();
 ctx.arc(kx,ky,4,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#ff3636";
 ctx.beginPath();
 ctx.arc(90,90,5,0,Math.PI*2);
 ctx.fill();
}

// GAME LOOP
let lastTime=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-lastTime)/1000,.04);
 lastTime=now;

 // WALKING MOVEMENT
 if(!inCar&&!storyOpen){
  if(stickId===null){
   controlAngle=cameraAngle;
  }

  const forward=new THREE.Vector3(
   Math.sin(controlAngle),0,Math.cos(controlAngle)
  );

  const right=new THREE.Vector3(
   Math.cos(controlAngle),0,-Math.sin(controlAngle)
  );

  const forwardInput=-joyY;
  const sideInput=joyX;

  const direction=forward.clone().multiplyScalar(forwardInput)
   .add(right.clone().multiplyScalar(sideInput));

  if(direction.length()>1)direction.normalize();

  const moving=direction.length()>.05;
  const speed=running?9:5;

  moveObject(
   player,
   direction.x*speed*dt,
   direction.z*speed*dt,
   .55
  );

  if(moving){
   player.rotation.y=Math.atan2(direction.x,direction.z);

   const phase=now*.012*(running?1.5:1);

   playerModel.legs[0].rotation.x=Math.sin(phase)*.65;
   playerModel.legs[1].rotation.x=-Math.sin(phase)*.65;
   playerModel.arms[0].rotation.x=-Math.sin(phase)*.5;
   playerModel.arms[1].rotation.x=Math.sin(phase)*.5;
  }else{
   playerModel.legs.forEach(l=>l.rotation.x=0);
   playerModel.arms.forEach(a=>a.rotation.x=0);
  }

  if(jumping){
   player.position.y+=verticalSpeed*dt;
   verticalSpeed-=18*dt;

   if(player.position.y<=0){
    player.position.y=0;
    jumping=false;
    verticalSpeed=0;
   }
  }
 }

// CAR DRIVING
 if(inCar&&!storyOpen){
  const driveInput=-joyY;

  if(Math.abs(driveInput)>.08){
   const turnRate=2.0;
   car.rotation.y+=joyX*turnRate*dt*
    (driveInput>=0?1:-1);
  }

  const speed=running?21:12;
  const forwardX=Math.sin(car.rotation.y);
  const forwardZ=Math.cos(car.rotation.y);

  const dx=forwardX*driveInput*speed*dt;
  const dz=forwardZ*driveInput*speed*dt;

  moveObject(car,dx,dz,1.5);

  if(Math.abs(driveInput)>.05){
   playerCar.wheels.forEach(w=>{
    w.rotation.x+=driveInput*speed*dt;
   });
  }
 }

// NPC ANIMATION
 npcs.forEach(npc=>{
  const u=npc.userData;

  u.angle+=(Math.random()-.5)*dt*.6;

  const dx=Math.sin(u.angle)*u.speed*dt;
  const dz=Math.cos(u.angle)*u.speed*dt;

  if(!blocked(npc.position.x+dx,npc.position.z+dz,.5)){
   npc.position.x+=dx;
   npc.position.z+=dz;
  }else{
   u.angle+=Math.PI;
  }

  npc.rotation.y=u.angle;
  u.phase+=dt*5;

  u.model.legs[0].rotation.x=Math.sin(u.phase)*.35;
  u.model.legs[1].rotation.x=-Math.sin(u.phase)*.35;
  u.model.arms[0].rotation.x=-Math.sin(u.phase)*.25;
  u.model.arms[1].rotation.x=Math.sin(u.phase)*.25;
 });

// TRAFFIC
 traffic.forEach(t=>{
  const u=t.userData;

  if(u.horizontal){
   t.position.x+=u.speed*u.dir*dt;
   t.rotation.y=u.dir>0?Math.PI/2:-Math.PI/2;
  }else{
   t.position.z+=u.speed*u.dir*dt;
   t.rotation.y=u.dir>0?0:Math.PI;
  }

  u.wheels.forEach(w=>w.rotation.x+=u.speed*dt);

  if(t.position.x>190)t.position.x=-190;
  if(t.position.x<-190)t.position.x=190;
  if(t.position.z>190)t.position.z=-190;
  if(t.position.z<-190)t.position.z=190;
 });

// ORIGINAL PACKAGES
 if(!inCar){
  packages.forEach(p=>{
   if(p.visible&&player.position.distanceTo(p.position)<2.2){
    p.visible=false;
    packageCount++;
    cash+=100;

    $("cash").textContent=cash;
    $("packages").textContent=packageCount;

    if(packageCount>=8){
     $("mission").textContent="PACKAGE MISSION COMPLETE! +₹800";
    }else if(storyStage===3){
     $("mission").textContent="Story complete! Collect packages";
    }
   }
  });
 }

 packages.forEach(p=>{
  if(p.visible){
   p.rotation.y+=dt*1.4;
   p.position.y=.2+Math.sin(now*.003)*.15;
  }
 });

// STORY INTERACTION
 const storyTarget=inCar?car:player;
 const nearKarthik=
  storyTarget.position.distanceTo(karthik.position)<8;
 const nearParcel=
  storyTarget.position.distanceTo(storyParcel.position)<4;

 storyAction.style.display="none";
 storyHint.style.display="none";

 if(!storyOpen){
  if(storyStage===0&&nearKarthik){
   storyAction.style.display="block";
   storyAction.textContent="TALK";
   storyHint.style.display="block";
   storyHint.textContent="Talk to Karthik";
  }
  else if(storyStage===1){
   storyHint.style.display="block";
   storyHint.textContent="Find the yellow parcel • Orange marker on map";
   if(nearParcel&&!storyParcelFound){
    storyAction.style.display="block";
    storyAction.textContent="COLLECT";
    storyHint.textContent="Press COLLECT to take the parcel";
   }
  }
  else if(storyStage===2&&nearKarthik){
   storyAction.style.display="block";
   storyAction.textContent="TALK";
   storyHint.style.display="block";
   storyHint.textContent="Return to Karthik";
  }
  else if(storyStage===3&&nearKarthik){
   storyAction.style.display="block";
   storyAction.textContent="TALK";
  }
 }

// STORY CHARACTER IDLE ANIMATION
 karthikModel.legs.forEach(l=>l.rotation.x=0);
 karthikModel.arms.forEach(a=>a.rotation.x=0);

 updateCamera(dt);
 drawMap();
 renderer.render(scene,camera);
}

// STORY ACTION BUTTON
storyAction.onclick=()=>{
 if(storyOpen)return;

 const target=inCar?car:player;

 if(storyStage===0&&target.position.distanceTo(karthik.position)<8){
  openStory();
 }
 else if(storyStage===1&&target.position.distanceTo(storyParcel.position)<4&&!storyParcelFound){
  storyParcelFound=true;
  storyParcel.visible=false;
  storyStage=2;
  updateStoryMission();
  alert("PARCEL COLLECTED!\n\nYou found the missing parcel. Return to Karthik.");
 }
 else if(storyStage===2&&target.position.distanceTo(karthik.position)<8){
  openStory();
 }
 else if(storyStage===3&&target.position.distanceTo(karthik.position)<8){
  storyName.textContent="KARTHIK";
  storyText.textContent="Thanks again, friend! The streets of Madurai are waiting. Your next adventure is coming soon!";
  storyBox.style.display="block";
  storyAction.style.display="none";
  storyOpen=true;
  storyNext.textContent="CLOSE";
 }
};

// RESIZE AND START
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

updateStoryMission();
requestAnimationFrame(animate);
$("loading").classList.add("hide");

})();
</script>
</body>
</html>
